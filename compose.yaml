# WooCommerce stack: Caddy + WordPress (PHP-FPM) + MariaDB, with WP-CLI setup,
# system cron and optional backups, Redis object cache and Mailpit.
#
# Quick start (development):
#   cp .env.dev.example .env
#   docker compose up -d
#   docker compose logs -f setup   # wait for "==> Done"
#
# Production: start from .env.prod.example instead. See README.md.
#
# Required variables have no default: compose refuses to start without them.

name: ${COMPOSE_PROJECT_NAME:-woocommerce}

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

# Environment shared by PHP-FPM and every WP-CLI container.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  WORDPRESS_DEBUG: ${WP_DEBUG:-0}
  WORDPRESS_CONFIG_EXTRA: require '/usr/local/share/wordpress/config.php';
  WP_URL: ${WP_URL:?Set WP_URL in .env (e.g. https://shop.example.com)}
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-production}
  WP_DISALLOW_FILE_EDIT: ${WP_DISALLOW_FILE_EDIT:-true}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
  PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
  UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-64M}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  REDIS_HOST: ${REDIS_HOST:-}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PREFIX: ${REDIS_PREFIX:-wp}

# Files mounted in PHP-FPM and every WP-CLI container.
x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  - ./config/wordpress/config.php:/usr/local/share/wordpress/config.php:ro
  - ./config/wordpress/mu-plugins:/usr/local/share/wordpress/mu-plugins:ro
  - ./config/php/php.ini:/usr/local/etc/php/conf.d/zz-stack.ini:ro
  - ./scripts:/usr/local/share/stack:ro

services:
  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}

  # PHP-FPM with WordPress. Not published; Caddy talks to it on port 9000.
  wordpress:
    image: wordpress:${WP_VERSION:-7.1.2}-php${PHP_VERSION:-8.4}-fpm-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    environment:
      <<: *wp-env
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-10}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-2}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-4}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
    # Lets WordPress reach services on the host (e.g. an app running locally)
    # at http://host.docker.internal:<port>, also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp_data:/var/www/html
      - ./config/wordpress/config.php:/usr/local/share/wordpress/config.php:ro
      - ./config/wordpress/mu-plugins:/usr/local/share/wordpress/mu-plugins:ro
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/zz-stack.ini:ro
      - ./config/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-stack.conf:ro
    healthcheck:
      # FPM is listening (the entrypoint copies WordPress before starting it).
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${WP_MEMORY_LIMIT:-1g}

  caddy:
    image: caddy:${CADDY_VERSION:-2.11}-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-64M}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Read-only: Caddy only serves static files and forwards PHP to FPM.
      - wp_data:/var/www/html:ro
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates and keys (keep them: ACME rate limits).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Internal :8080 site. 200 (installed) or 302 (redirect to install.php).
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:8080/wp-login.php | grep -qE '^(200|302)$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-256m}

  # One-shot WP-CLI job: installs WordPress and WooCommerce, initial settings.
  # Safe to repeat; runs on every `up`. The cli and fpm-alpine images share
  # the www-data UID/GID (82).
  setup:
    image: &wpcli-image wordpress:cli-${WPCLI_VERSION:-2.12}-php${PHP_VERSION:-8.4}
    logging: *logging
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      <<: *wp-env
      WC_VERSION: ${WC_VERSION:-}
      WP_LOCALE: ${WP_LOCALE:-es_CL}
      WP_TITLE: ${WP_TITLE:-WooCommerce}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Set WP_ADMIN_PASSWORD in .env}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Set WP_ADMIN_EMAIL in .env}
      WC_COUNTRY: ${WC_COUNTRY:-CL}
      WC_CURRENCY: ${WC_CURRENCY:-CLP}
      # www-data's HOME is not writable; WP-CLI needs a cache dir.
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    entrypoint: ["sh", "/usr/local/share/stack/setup.sh"]
    restart: "no"

  # Runs WP-Cron (and WooCommerce's Action Scheduler) every CRON_INTERVAL seconds.
  cron:
    image: *wpcli-image
    restart: unless-stopped
    logging: *logging
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *wp-env
      CRON_INTERVAL: ${CRON_INTERVAL:-60}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    entrypoint: ["sh", "/usr/local/share/stack/cron.sh"]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/share/stack/cron.sh", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${CRON_MEMORY_LIMIT:-512m}

  # Optional (profile "backup"): DB dump + wp-content archive every
  # BACKUP_INTERVAL_HOURS, kept BACKUP_KEEP_DAYS days in the `backups` volume
  # (overrides/local-dirs.yaml puts them in a local directory instead).
  backup:
    image: mariadb:${MARIADB_VERSION:-12.3}
    profiles: ["backup"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-wordpress}
      DB_USER: ${DB_USER:-wordpress}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      # Read-write so `backup.sh restore` can put wp-content back.
      - wp_data:/var/www/html
      - backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["bash", "/usr/local/bin/backup.sh"]
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/backup.sh", "health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT:-512m}

  # Optional (profile "redis"): object cache. Set REDIS_HOST=redis too.
  redis:
    image: redis:${REDIS_VERSION:-8.8}-alpine
    profiles: ["redis"]
    restart: unless-stopped
    logging: *logging
    # Pure cache: no persistence, evict least recently used keys when full.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}

  # Optional (profile "mailpit", development): catches all outgoing mail.
  # Set SMTP_HOST=mailpit and SMTP_PORT=1025; web UI on MAILPIT_PORT.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.31}
    profiles: ["mailpit"]
    restart: unless-stopped
    logging: *logging
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"

  # Ad hoc WP-CLI (profile "tools"), e.g.: docker compose run --rm wp plugin list
  wp:
    image: *wpcli-image
    profiles: ["tools"]
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db_data:
  wp_data:
  caddy_data:
  caddy_config:
  backups:
