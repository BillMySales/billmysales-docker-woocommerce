; PHP-FPM pool sizing. Values come from environment variables set in compose.yaml.
; Loaded after the image's zz-docker.conf, so these win.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
; Access log off: Caddy already logs every request.
access.log = /dev/null
